<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#06080C" />
    </linearGradient>

    <!-- Emerald Brand Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#089981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#1E2536" stroke-width="8" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#089981" opacity="0.18" filter="url(#glow)" />

  <!-- Riskil Emblem: Geometric "R" + Lightning Cut -->
  <g transform="translate(136, 120)">
    <!-- Vertical Pillar -->
    <rect x="0" y="0" width="48" height="272" rx="16" fill="url(#emeraldGrad)" />

    <!-- Upper Bow of the 'R' -->
    <path d="M 48 24 
             C 140 24, 180 36, 180 96 
             C 180 156, 140 168, 48 168 
             Z" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="44" 
          stroke-linejoin="round" />

    <!-- Lightning Diagonal Leg of the 'R' -->
    <path d="M 76 150 
             L 155 272 
             L 130 272 
             L 96 215 
             Z" 
          fill="url(#emeraldGrad)" />

    <!-- Center Core Spark -->
    <polygon points="80,95 105,95 90,135 125,135 75,185 88,145 68,145" fill="#FFFFFF" />
  </g>
</svg>
